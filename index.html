<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>暴击大黄狗 · 试玩版</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #14301a; overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* 画布用 CSS 撑满视口：即使 JS 尺寸测量有偏差，画面也一定铺满全屏 */
  #game {
    position: fixed; left: 0; top: 0;
    width: 100%; height: 100%;
    display: block;
  }
  #tip {
    position: fixed; left: 0; right: 0; bottom: 8px;
    text-align: center; color: rgba(255,255,255,0.45);
    font: 12px/1.5 sans-serif; pointer-events: none;
    z-index: 2;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="tip">试玩版 · 点击屏幕出脚</div>

<script src="./src/storage.js"></script>
<script src="./src/audio.js"></script>
<script src="./src/core.js"></script>
<script>
(function () {
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');

  /* ---------- 尺寸测量：优先 CSS 实际布局尺寸（微信 webview 的 innerWidth 常报错） ---------- */
  function measure() {
    var r = canvas.getBoundingClientRect();
    var w = Math.round(r.width);
    var h = Math.round(r.height);
    if (!w || !h) {
      var doc = document.documentElement;
      w = w || doc.clientWidth || window.innerWidth || 375;
      h = h || doc.clientHeight || window.innerHeight || 667;
    }
    return { w: w, h: h };
  }
  function pixelRatio() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var s = measure();
    // 限制总像素量，避免大屏/高 dpr 设备内存爆掉
    var maxPx = 2200000;
    if (s.w * s.h * dpr * dpr > maxPx) dpr = Math.sqrt(maxPx / (s.w * s.h));
    return Math.max(dpr, 0.75);
  }

  var size = measure();
  var dpr = pixelRatio();

  var audio = BaojiAudio.create();

  /* ---------- 图片素材：加载完成后才交给 core 绘制（未完成时回退代码绘制） ---------- */
  var imgCache = {};
  function loadImg(src) {
    if (!src || imgCache[src]) return;
    var img = new Image();
    img.src = src;
    imgCache[src] = img;
  }
  loadImg(BaojiDog.CONFIG.assets.bg);
  BaojiDog.CONFIG.assets.levels.forEach(function (e) { loadImg(e.src); });

  BaojiDog.launch({
    canvas: canvas,
    ctx: ctx,
    width: size.w,
    height: size.h,
    dpr: dpr,
    audio: audio,
    storage: BaojiStore,
    canDrawImage: true,
    getImage: function (src) {
      var img = imgCache[src];
      // 只在真正解码完成后返回，否则 core 会画一张空白图（狗会消失）
      return (img && img.complete && img.naturalWidth > 0) ? img : null;
    },
    onTap: function (cb) {
      function down(e) {
        cb();
        if (e && e.preventDefault) e.preventDefault();
      }
      if (window.PointerEvent) {
        canvas.addEventListener('pointerdown', down);
      } else {
        canvas.addEventListener('touchstart', down, { passive: false });
        canvas.addEventListener('mousedown', down);
      }
    },
    onHide: function (cb) {
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) cb();
      });
    },
    onShow: function (cb) {
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) cb();
      });
    },
    onResize: function (cb) {
      var lastW = 0, lastH = 0;
      function sync() {
        var s = measure();
        if (s.w === lastW && s.h === lastH) return;
        lastW = s.w; lastH = s.h;
        cb(s.w, s.h);
      }
      // 微信内置浏览器首屏尺寸常报错：多次延迟重测 + 监听变化
      window.addEventListener('resize', sync);
      window.addEventListener('orientationchange', function () { setTimeout(sync, 200); });
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) setTimeout(sync, 200);
      });
      [0, 120, 350, 800, 1500, 3000].forEach(function (ms) { setTimeout(sync, ms); });
      setInterval(sync, 1200);
      sync();
    }
  });
})();
</script>
</body>
</html>
